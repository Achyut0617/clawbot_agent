[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clawbot-agent"
version = "0.2.0"
description = "Cross-platform, local-first voice and text agent with OpenClaw orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5"
]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<1", "vosk>=0.3.45,<1", "pyttsx3>=2.90,<3"]
wakeword = ["openwakeword>=0.6,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6.0"]

[project.scripts]
clawbot = "clawbot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clawbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
